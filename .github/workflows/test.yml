name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats shfmt
      - run: make check
      - name: Container smoke test
        run: make integration-test
